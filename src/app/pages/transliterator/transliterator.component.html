<div class="translator-layout">
  <app-side-nav></app-side-nav>

  <main class="translator-page">
    <header class="translator-header">
      <div class="title-wrap">
        <div class="title-icon">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
            <path d="M3 4h7M3 8h5M3 12h3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            <path d="M11 5h4M13 3v8M10.5 11.5c1.2-1.4 3.1-3.4 4.5-6.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            <path d="M11 14h4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
        </div>
        <div>
          <h1>Lotin Kiril tarjimoni</h1>
          <div class="meta-line">
            <span>{{ sourceLength() }} belgi</span>
            <span>{{ outputLength() }} belgi</span>
          </div>
        </div>
      </div>

      <div class="mode-switch">
        <button [class.active]="mode() === 'latin-cyrillic'" (click)="setMode('latin-cyrillic')">
          Lotin → Kiril
        </button>
        <button [class.active]="mode() === 'cyrillic-latin'" (click)="setMode('cyrillic-latin')">
          Kiril → Lotin
        </button>
      </div>
    </header>

    <section class="workspace">
      <div class="text-panel">
        <div class="panel-head">
          <span>Matn</span>
          <button class="icon-btn" (click)="clearText()" [disabled]="!sourceText()" title="Tozalash">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
              <path d="M4 4l6 6M10 4l-6 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
        <textarea
          [ngModel]="sourceText()"
          (ngModelChange)="onSourceTextChange($event)"
          spellcheck="false"
          placeholder="Matn kiriting yoki fayl yuklang"></textarea>
      </div>

      <div class="swap-col">
        <button class="swap-btn" (click)="swapText()" [disabled]="!outputText()" title="Almashtirish">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M3 5h9M9.5 2.5 12 5 9.5 7.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M13 11H4M6.5 8.5 4 11l2.5 2.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>

      <div class="text-panel result-panel">
        <div class="panel-head">
          <span>Natija</span>
          <button class="copy-btn" (click)="copyOutput()" [disabled]="!outputText()" title="Nusxalash">
            @if (copied()) {
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                <path d="M3 7.2 5.6 10 11 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              Nusxalandi
            } @else {
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                <rect x="4.5" y="3.5" width="6" height="7" rx="1" stroke="currentColor" stroke-width="1.2"/>
                <path d="M3.5 9.5H3a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1h5a1 1 0 0 1 1 1v.5" stroke="currentColor" stroke-width="1.2"/>
              </svg>
              Nusxalash
            }
          </button>
        </div>
        <textarea
          [ngModel]="outputText()"
          (ngModelChange)="onOutputTextChange($event)"
          spellcheck="false"
          placeholder="Natija shu yerda chiqadi"></textarea>
      </div>
    </section>

    <section class="file-section">
      <div class="file-main">
        <label class="file-drop" [class.is-loading]="converting()">
          <input
            type="file"
            accept=".docx,.xlsx,.xls,.pptx,.txt,.csv,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.openxmlformats-officedocument.presentationml.presentation"
            (change)="onFileSelected($event)" />
          <span class="file-icon">
            @if (converting()) {
              <span class="spinner"></span>
            } @else {
              <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                <path d="M5 2.5h5l3 3v10H5v-13Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
                <path d="M10 2.5v3h3" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
                <path d="M7 11h4M9 8v6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
              </svg>
            }
          </span>
          <span class="file-copy">
            <strong>{{ fileName() || 'Fayl yuklash' }}</strong>
            <small>DOCX, XLSX, XLS, PPTX, TXT, CSV</small>
          </span>
        </label>

        <div class="file-state">
          @if (fileStatus()) {
            <div class="file-message ok">{{ fileStatus() }}</div>
          }
          @if (fileError()) {
            <div class="file-message error">{{ fileError() }}</div>
          }
        </div>
      </div>

      @if (fileReady()) {
        <button class="download-btn" type="button" [disabled]="converting()" (click)="downloadConvertedFile()">
          <svg width="15" height="15" viewBox="0 0 15 15" fill="none">
            <path d="M7.5 2v7M4.5 6.5l3 3 3-3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M3 12.5h9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          Yuklab olish
        </button>
      }
    </section>
  </main>
</div>
